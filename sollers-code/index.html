<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<title>SOLLERS CODE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOLLERS CODE">
<link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>

<!-- ============ TRAVA (PIN) ============ -->
<section id="trava" class="trava">
  <div class="trava-box">
    <div class="marca">SOLLERS <span>CODE</span></div>
    <p id="trava-msg" class="trava-msg">Digite seu PIN</p>
    <div id="pin-pontos" class="pin-pontos"></div>
    <div class="teclado" id="teclado"></div>
    <button id="btn-esqueci" class="link-discreto" type="button">Esqueci o PIN</button>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="app oculto">
  <nav class="nav" id="nav">
    <div class="marca nav-marca">SOLLERS <span>CODE</span></div>
    <button data-view="inicio" class="nav-btn ativo" type="button"><span class="ico">⌂</span><span>Início</span></button>
    <button data-view="revisar" class="nav-btn" type="button"><span class="ico">↻</span><span>Revisar</span><b id="badge-rev" class="badge oculto"></b></button>
    <button data-view="diario" class="nav-btn" type="button"><span class="ico">✎</span><span>Diário</span></button>
    <button data-view="consulta" class="nav-btn" type="button"><span class="ico">☰</span><span>Consulta</span></button>
    <button data-view="dados" class="nav-btn" type="button"><span class="ico">⚙</span><span>Dados</span></button>
  </nav>

  <main id="conteudo" class="conteudo"></main>
</div>

<!-- ============ DIÁLOGO ============ -->
<div id="dialogo" class="dialogo oculto" role="dialog" aria-modal="true">
  <div class="dialogo-box">
    <p id="dialogo-texto"></p>
    <div class="dialogo-botoes">
      <button id="dialogo-nao" class="btn btn-sec" type="button">Cancelar</button>
      <button id="dialogo-sim" class="btn btn-alerta" type="button">Confirmar</button>
    </div>
  </div>
</div>

<div id="aviso" class="aviso oculto"></div>

<script src="licoes.js?v=1.0.0"></script>
<script src="app.js?v=1.0.0"></script>
</body>
</html>
